[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "analog-tv"
version = "2.1.0"
description = "A self-hosted green-phosphor television channel and weather broadcasting appliance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Analog TV contributors" }]
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.43",
    "pydantic-settings==2.10.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "python-telegram-bot==22.3",
    "beautifulsoup4==4.13.4",
    "PyJWT[crypto]>=2.9,<3.0",
    "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["analog_tv*"]
