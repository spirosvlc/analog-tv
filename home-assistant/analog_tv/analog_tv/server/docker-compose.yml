services:
  analog-tv:
    build: .
    container_name: analog-tv
    ports:
      - "8155:8080"
    volumes:
      - ./data:/opt/analog_tv/data
      - ./media:/media/analog_tv:ro
    environment:
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    env_file:
      - .env
    restart: unless-stopped
