name: Analog TV
version: "2.1.1"
slug: analog_tv
description: Green-phosphor TV guide, 24/7 weather, IPTV, locally secured Broadcast Control, and retro alerts.
url: "https://github.com/spirosvlc/analog-tv"

arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
ports:
  8080/tcp: 8155
ports_description:
  8080/tcp: Analog TV player and control center
webui: "http://[HOST]:[PORT:8080]/"
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: addon_config
    read_only: false
backup: cold
backup_exclude:
  - "/media/**"
  - "/share/**"
options:
  log_level: INFO
  trusted_proxy_ip: "127.0.0.1"
schema:
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
  trusted_proxy_ip: str
