name: Analog TV
version: "2.1.0-ha.6"
slug: analog_tv
description: Your own always-on Analog television station.
url: "https://github.com/spirosvlc/analog-tv"

arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
ports:
  8080/tcp: 8155
ports_description:
  8080/tcp: Analog TV player and control center
webui: "http://[HOST]:[PORT:8080]/"
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: addon_config
    read_only: false
backup: cold
backup_exclude:
  - "/media/**"
  - "/share/**"
options:
  log_level: INFO
schema:
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
